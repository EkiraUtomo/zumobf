<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZumHub Obfuscator</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header">
  <div class="logo">ZumHub <span>Obfuscator</span></div>
  <div class="badge">v9</div>
  <div class="badge" style="background:#14532d;color:#22c55e;margin-left:4px;">Executor Safe</div>
</header>

<main class="main">
  <!-- Input pane -->
  <div class="pane">
    <div class="pane-header">
      <span class="pane-title">Source</span>
      <div class="pane-actions">
        <span id="in-stats" class="chip">0 lines</span>
        <button class="btn btn-ghost btn-sm" id="clear-btn">Clear</button>
      </div>
    </div>
    <textarea id="input" spellcheck="false" placeholder="-- Paste your Luau / executor script here&#10;-- Supports: closures, metatables, coroutines,&#10;-- hookfunction, getupvalues, debug.*, getfenv, setfenv,&#10;-- type annotations, require, loadstring, and more."></textarea>
    <div class="controls">
      <div class="status">
        <div class="dot" id="status-dot"></div>
        <span id="status-txt">Ready</span>
      </div>
      <div class="slider-wrap">
        <label for="intensity">Intensity</label>
        <input type="range" id="intensity" min="1" max="5" value="3">
        <span class="slider-val" id="intensity-val">3</span>
      </div>
      <button class="btn btn-primary" id="obf-btn">Obfuscate</button>
    </div>
  </div>

  <!-- Output pane -->
  <div class="pane">
    <div class="pane-header">
      <span class="pane-title">Output</span>
      <div class="pane-actions">
        <span id="out-stats" class="chip"></span>
        <button class="btn btn-ghost btn-sm" id="copy-btn">Copy</button>
      </div>
    </div>
    <pre id="output"></pre>
  </div>
</main>

<script src="js/app.js"></script>
</body>
</html>
